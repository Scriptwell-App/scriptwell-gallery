name: Count stars

# Stars are taps on the star button in the app. The submission service
# (worker/, GET /v1/stars) counts them, one per install per script, and this
# workflow copies the counts into stats.json, which the publish workflow folds
# into index.json. Only the counts leave the service.
#
# The service's address is the repository variable STARS_URL (Settings →
# Secrets and variables → Actions → Variables), or the default below.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: true

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch counts
        env:
          STARS_URL: ${{ vars.STARS_URL || 'https://scriptwellworker.o-h.dev/v1/stars' }}
        run: |
          node - <<'JS'
          const fs = require("fs");
          (async () => {
            const response = await fetch(process.env.STARS_URL, { headers: { accept: "application/json" } });
            if (!response.ok) throw new Error(`${process.env.STARS_URL} answered ${response.status}`);
            const counts = await response.json();
            const stats = {};
            for (const [id, value] of Object.entries(counts || {})) {
              if (!/^[a-z0-9][a-z0-9-]{2,49}$/.test(id) || !fs.existsSync(`scripts/${id}/meta.json`)) continue;
              const stars = value && value.stars;
              if (Number.isInteger(stars) && stars > 0) stats[id] = { stars };
            }
            const ordered = Object.fromEntries(Object.keys(stats).sort().map((k) => [k, stats[k]]));
            fs.writeFileSync("stats.json", JSON.stringify(ordered, null, 2) + "\n");
            console.log(`Counted stars for ${Object.keys(ordered).length} script(s).`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          JS

      - name: Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Update stars"
          git push
