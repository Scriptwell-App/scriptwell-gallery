name: Validate submission

# Why pull_request_target, and why it is safe here
# ------------------------------------------------
# Submissions come from forks (or, from the app's submission service, from
# `submit/<id>` branches in this repository, opened by its GitHub App). A plain
# `pull_request` run from a fork gets a read-only token, so it could not post
# the summary comment, apply labels or close a pull request.
# `pull_request_target` runs in the context of the BASE repository with a
# token that can.
#
# The well-known danger of pull_request_target is executing code from the
# pull request with that token. This workflow never does:
#
#   * The tools that run come from the base branch (checked out into base/).
#     `npm` installs dependencies only in base/tools, with --ignore-scripts.
#   * The pull request is checked out into pr/ and is only ever READ as data
#     by base/tools/review-pr.mjs and base/tools/moderate.mjs. Nothing in pr/
#     is executed, installed, sourced or imported. The tools refuse symlinks
#     and oversized files.
#   * Both checkouts use persist-credentials: false, so no token is left on
#     disk next to untrusted files.
#   * The token is limited to the three permissions below. The only other
#     secret is the automated review's API key, exposed to one step, which
#     sends the pull request's files to that service as data and runs nothing
#     from them.
#   * Values from the pull request reach shell steps only through `env:`,
#     never by `${{ }}` interpolation inside a script.
#
# Keep it that way: do not add a step that runs anything from pr/.
#
# What happens, in order
# ----------------------
#   1. review-pr.mjs: schema, analyzer, word filter, icon and screenshots.
#      Hard findings block.
#   2. moderate.mjs (when its API key is set): the automated review reads the
#      files and the guidelines and answers with a verdict and a summary of
#      what the script does. A high-confidence "reject" for malware, illegal content,
#      spam or objectionable content closes the pull request; everything else
#      is a note for the maintainer.
#   3. One sticky comment carries both, and the labels follow:
#      needs-changes, needs-careful-review, checks-passed, rejected.
#   4. A maintainer reads the script and merges. Nothing is published without.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gallery checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out base branch (trusted tools)
        uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false

      - name: Check out pull request (untrusted data)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tool dependencies (base only)
        working-directory: base/tools
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: List changed files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = new Set();
            for (const file of files) {
              paths.add(file.filename);
              if (file.previous_filename) paths.add(file.previous_filename);
            }
            require('fs').writeFileSync('changed.json', JSON.stringify([...paths]));

      - name: Run checks
        id: checks
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          node base/tools/review-pr.mjs \
            --root pr \
            --base-root base \
            --changed changed.json \
            --pr-author "$PR_AUTHOR" \
            --author-association "$AUTHOR_ASSOCIATION" \
            --head-repo "$HEAD_REPO" \
            --head-sha "$HEAD_SHA" \
            --out review
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # Reads pr/ as data and sends it to the review service. Skipped without a
      # key; a failure here never blocks (the maintainer still reviews).
      - name: Automated review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -f review/review.json ]; then
            echo "No review.json; skipping."
            exit 0
          fi
          node base/tools/moderate.mjs \
            --root pr \
            --base-root base \
            --review review/review.json \
            --out review

      - name: Comment, label, and close rejected submissions
        uses: actions/github-script@v7
        env:
          # A person reopening a closed pull request is a decision; the automated review does not get to undo it.
          ALLOW_CLOSE: ${{ github.event.action != 'reopened' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- scriptwell-gallery-review -->';
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };

            let body = marker + '\n## Gallery checks: could not run\n\nThe review tool did not produce a report. See the workflow log.';
            let labels = ['needs-changes'];
            if (fs.existsSync('review/review.md') && fs.existsSync('review/review.json')) {
              body = fs.readFileSync('review/review.md', 'utf8');
              labels = JSON.parse(fs.readFileSync('review/review.json', 'utf8')).labels;
            }

            let moderation = null;
            if (fs.existsSync('review/moderation.md') && fs.existsSync('review/moderation.json')) {
              moderation = JSON.parse(fs.readFileSync('review/moderation.json', 'utf8'));
              body += '\n\n' + fs.readFileSync('review/moderation.md', 'utf8');
              for (const label of moderation.labels || []) if (!labels.includes(label)) labels.push(label);
            }
            const closing = Boolean(moderation && moderation.close && process.env.ALLOW_CLOSE === 'true');
            if (closing) labels = labels.filter((name) => name !== 'checks-passed');

            // One sticky comment: update it if it exists.
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const existing = comments.find((c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: issue.owner, repo: issue.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

            // Exactly the labels from this run; drop stale ones from earlier runs.
            const managed = ['needs-changes', 'needs-careful-review', 'checks-passed', 'rejected'];
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, { ...issue, per_page: 100 });
            for (const label of current) {
              if (managed.includes(label.name) && !labels.includes(label.name)) {
                try {
                  await github.rest.issues.removeLabel({ ...issue, name: label.name });
                } catch (error) {
                  core.info(`Could not remove label ${label.name}: ${error.message}`);
                }
              }
            }
            await github.rest.issues.addLabels({ ...issue, labels: labels.filter((name) => managed.includes(name)) });

            if (closing) {
              await github.rest.pulls.update({ owner: issue.owner, repo: issue.repo, pull_number: issue.issue_number, state: 'closed' });
              core.notice('Closed: the automated review rejected this submission with high confidence. See the comment.');
            }

      - name: Fail on blocking findings
        if: steps.checks.outputs.exit != '0'
        run: |
          echo "Blocking findings. See the summary comment on the pull request."
          exit 1
